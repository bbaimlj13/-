# prometheus.yml

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  
  - job_name: 'api'
    static_configs:
      # 使用 docker-compose.yml 中定义的服务名
      - targets: ['news_crawler_api:8000'] 
    metrics_path: '/metrics'
    scrape_interval: 10s